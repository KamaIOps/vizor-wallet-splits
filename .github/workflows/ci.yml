# The analyzer, on every push to the splits branch.
#
# `flutter test` is deliberately absent, and the reason is worth stating so it
# is not "fixed" back in. Every test this repository's splits work owns lives
# in `integration_test/` and drives real screens, so all of them need a booted
# simulator that a hosted runner does not have. Running `flutter test` here
# would therefore check none of this work — it would run the upstream wallet's
# own suite, of which 80 fail on Linux for want of the native bridge, the
# platform plugins and a Tor connection. A red lane that tests nothing we
# wrote teaches nobody anything.
#
# What the device lanes are and how to run them is in SPLITS.md.
#
# The feature resolves three dependencies by relative path, so all three
# repositories are checked out as siblings under the workspace. The other two
# are private, which `GITHUB_TOKEN` cannot reach: it is scoped to this
# repository alone. `SPLITS_REPOS_TOKEN` is a personal access token with read
# access to both.
#
# `dart format` is deliberately absent. This tree does not currently satisfy
# either formatter, so the check would fail on arrival and say nothing about
# the change that triggered it.
name: ci

on:
  push:
    branches: [splits-clean]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Vizor-Wallet

      # Sibling checkouts, spelled exactly as pubspec.yaml reaches them:
      # ../Splitz-Protocol/splitz_host, ../Splitz-Protocol/dart and
      # ../vizor-splitz-ui.
      - uses: actions/checkout@v4
        with:
          repository: KamaIOps/Splitz-Protocol
          path: Splitz-Protocol
          token: ${{ secrets.SPLITS_REPOS_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: KamaIOps/vizor-splitz-ui
          path: vizor-splitz-ui
          token: ${{ secrets.SPLITS_REPOS_TOKEN }}

      # Pinned to the version `.fvmrc` names. A newer Flutter reformats and
      # re-lints, so an unpinned runner disagrees with every machine here.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: Vizor-Wallet

      # The analyzer is the whole job, and it is not a thin one: it type
      # checks this repository against both sibling packages, so a change to
      # a screen's signature or to the protocol's public surface fails here
      # rather than on a device twenty minutes later.
      - run: flutter analyze
        working-directory: Vizor-Wallet
