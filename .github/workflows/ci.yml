# The analyzer, the splits host tests, the send flow's tests and the native
# wallet library's unit tests, on every push to the splits branch.
#
# The whole `flutter test` suite is deliberately not run: it is mostly the
# upstream wallet's own, of which 80 fail on Linux for want of the native
# bridge, the platform plugins and a Tor connection, and a red lane that tests
# nothing we wrote teaches nobody anything. What runs is the host tests this
# branch owns — test/features/splits/, the bills screens under ui/ among
# them, and the incoming-link classifier — and test/features/send/, which
# carries the send and broadcast status a splits payment is reported by. The Rust job runs `cargo test --lib`; the tests under
# rust/tests/ need a regtest node and are not run here. The
# lanes that drive real screens are in integration_test/ and need a booted
# simulator a hosted runner does not have; SPLITS.md says how to run them.
#
# The feature resolves the protocol's two Dart packages by relative path, so
# that repository is checked out as a sibling under the workspace. It is
# private, which `GITHUB_TOKEN` cannot reach: it is scoped to this repository
# alone. `SPLITS_REPOS_TOKEN` is a personal access token with read access to it.
#
# `dart format` is deliberately absent. This tree does not currently satisfy
# either formatter, so the check would fail on arrival and say nothing about
# the change that triggered it.
name: ci

on:
  push:
    branches: [splits-clean]
  # `pull_request`, never `pull_request_target`. A pull request from a fork
  # runs here without this repository's secrets; `pull_request_target` runs in
  # the base repository's context, where `SPLITS_REPOS_TOKEN` is readable.
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Vizor-Wallet
          persist-credentials: false

      # The protocol commit this wallet is built and tested against. Without
      # it every run takes whatever the protocol's main holds that minute, and
      # a green run says nothing about which protocol it passed on.
      - id: protocol
        run: echo "rev=$(tr -d '[:space:]' < Vizor-Wallet/splitz-protocol.rev)" >> "$GITHUB_OUTPUT"

      # The sibling checkout, spelled exactly as pubspec.yaml reaches it:
      # ../Splitz-Protocol/splitz_host and ../Splitz-Protocol/dart. The token
      # is used for the clone and not written into its .git/config: every
      # later step — a third-party action, `pub get`, the tests — runs with
      # that directory readable.
      - uses: actions/checkout@v4
        with:
          repository: splitz-protocol/splitz
          ref: ${{ steps.protocol.outputs.rev }}
          path: Splitz-Protocol
          token: ${{ secrets.SPLITS_REPOS_TOKEN }}
          persist-credentials: false

      # Read from `.fvmrc`, the one place the version is named. A newer Flutter
      # reformats and re-lints, so an unpinned runner disagrees with every
      # machine here.
      - id: flutter
        run: echo "version=$(jq -r .flutter Vizor-Wallet/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: Vizor-Wallet

      # Not a thin check: it type checks this repository against the
      # protocol's packages, so a change to a screen's signature or to the
      # protocol's public surface fails here
      # rather than on a device twenty minutes later.
      - run: flutter analyze
        working-directory: Vizor-Wallet

      - run: >-
          flutter test test/features/splits test/features/send
          test/core/navigation/incoming_link_dispatch_test.dart
        working-directory: Vizor-Wallet

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ledger-transport-hid links hidapi, which needs libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo test --lib --locked
        working-directory: rust
